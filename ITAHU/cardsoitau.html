<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cards ITAU</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      max-width: 100%;
      overflow-x: hidden;
      box-sizing: border-box;
    }

    *, *::before, *::after {
      box-sizing: border-box;
    }

    #consolidacionitahu {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      width: 100%;
      max-width: 100%;
      margin: 0;
      padding: 15px;
    }

    #consolidacionitahu .card1itahu {
      background: white;
      border-radius: 10px;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
      padding: 20px;
      border: 1px solid #ddd;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
      width: 100%;
      min-width: 0;
      overflow: hidden;
    }

    #consolidacionitahu .card1itahu:hover {
      transform: translateY(-5px);
      box-shadow: 0 8px 15px rgba(0, 0, 0, 0.2);
    }

    #consolidacionitahu .card1itahu h3 {
      font-size: 18px;
      margin: 0 0 15px 0;
      word-break: break-word;
    }
    #consolidacionitahu .fields-grid {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 12px 10px;
      width: 100%;
    }

    #consolidacionitahu .field-container {
      margin: 0;
      min-width: 0;
      width: 100%;
    }

    #consolidacionitahu .field-container label {
      display: block;
      font-size: 12px;
      color: #555;
      margin-bottom: 4px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    #consolidacionitahu .field-container input[type="text"] {
      width: 100%;
      max-width: 100%;
      padding: 6px;
      font-size: 13px;
      border: 1px solid #ccc;
      border-radius: 5px;
      box-sizing: border-box;
      min-width: 0;
    }

    @media (max-width: 1024px) {
      #consolidacionitahu {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 767px) {
      #consolidacionitahu {
        padding: 10px;
      }
      #consolidacionitahu .fields-grid {
        grid-template-columns: 1fr 1fr;
      }
    }
    
    @media (max-width: 480px) {
      #consolidacionitahu .fields-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <div id="consolidacionitahu"></div>
</body>
</html>
